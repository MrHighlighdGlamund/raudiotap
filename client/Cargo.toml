[package]
name = "RaudioTap"
version = "0.1.0"
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
log = "0.4"
pollster = "0.2"
chrono = "0.4"
# egui = { version = "0.23.0", features = [ "log" ] }
egui = "0.23.0"
egui-wgpu = { version = "0.23.0", features = [ "winit" ] }
egui-winit = { version = "0.23.0", default-features = true, features = [ "android-game-activity" ] }
egui_demo_lib = "0.23.0"
jni = "0.21.1"
crossbeam-channel = "0.5.14"
cpal = { version = "0.15.2", features = ["oboe-shared-stdcxx"] }
rtrb = "0.3.2"
local-ip-addr = "0.1.1"
ndk-context = "0.1.1"
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13.0"

[features]
default = []
desktop = []

[lib]
name="main"
# crate_type=["cdylib"]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
path="src/lib.rs"
name="egui-test"
required-features = [ "desktop" ]

#[patch.crates-io]
#egui = { version = "0.22", path = "../../egui/crates/egui" }
#egui-wgpu = { version = "0.22", path = "../../egui/crates/egui-wgpu" }
#egui-winit = { version = "0.22", path = "../../egui/crates/egui-winit" }
